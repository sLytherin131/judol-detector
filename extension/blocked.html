<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situs Diblokir — Judol Detector</title>
    <style>
        @font-face {
            font-family: 'Nohemi';
            src: url('fonts/Nohemi-VF.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg:           #f5f5f5;
            --surface:      #ffffff;
            --border:       #e4e4e4;
            --text:         #111111;
            --text-2:       #555555;
            --text-3:       #999999;
            --danger:       #c92a2a;
            --danger-light: #fff5f5;
            --danger-border:#ffc9c9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nohemi', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .block-icon {
            width: 72px;
            height: 72px;
            background: var(--danger-light);
            border: 2px solid var(--danger-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 34px;
            line-height: 1;
        }

        .desc {
            font-size: 14px;
            color: var(--text-2);
            line-height: 1.65;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            width: auto;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            line-height: 1;
            background: var(--danger);
            color: white;
        }

        .btn:hover  { opacity: 0.88; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-logo {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            object-fit: contain;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Situs ini diblokir.</h1>
        <div class="block-icon">🚫</div>
        <p class="desc">Judol Detector mencegah akses ke situs ini karena terdeteksi mengandung konten promosi judi online.</p>
        <button class="btn" id="btnManage">Kelola daftar blokir</button>
        <p class="footer-note">
            <img src="icons/Icon_JD.png" class="footer-logo" alt="">
            Judol Detector
        </p>
    </div>

    <script src="blocked.js"></script>
</body>
</html>
